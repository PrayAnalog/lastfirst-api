apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: yt-reverse-playlist-ingress
spec:
  podSelector:
    matchLabels:
      app: yt-reverse-playlist
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
              app.kubernetes.io/component: controller
      ports:
        - protocol: TCP
          port: 8080
