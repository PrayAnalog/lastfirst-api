services:
  app:
    image: ghcr.io/prayanalog/lastfirst:v1
    restart: unless-stopped
    stop_grace_period: 25s
    environment:
      YT_API_KEY: ${YT_API_KEY:?YT_API_KEY is required}
    expose:
      - "8080"
    logging:
      driver: fluentd
      options:
        fluentd-address: 127.0.0.1:24224
        fluentd-async: "true"
        fluentd-sub-second-precision: "true"
        tag: app
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy:/etc/caddy
      - caddy_data:/data
    logging:
      driver: fluentd
      options:
        fluentd-address: 127.0.0.1:24224
        fluentd-async: "true"
        fluentd-sub-second-precision: "true"
        tag: caddy
  victorialogs:
    image: victoriametrics/victoria-logs:v1.52.0
    restart: unless-stopped
    command:
      - -storageDataPath=/vlogs
      - -retentionPeriod=90d
      - -retention.maxDiskUsagePercent=80
      - -memory.allowedBytes=128MiB
    ports:
      - "127.0.0.1:9428:9428"
    volumes:
      - vlogs_data:/vlogs
    logging:
      driver: local
  vector:
    image: timberio/vector:0.58.0-distroless-libc
    restart: unless-stopped
    depends_on:
      - victorialogs
    ports:
      - "127.0.0.1:24224:24224"
    volumes:
      - ./vector.yaml:/etc/vector/vector.yaml:ro
    logging:
      driver: local
volumes:
  caddy_data:
  vlogs_data:
