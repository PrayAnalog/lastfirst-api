apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: yt-reverse-playlist
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/limit-connections: "20"
    # Keep this above the app's 4 KiB limit so API clients receive its JSON 413.
    nginx.ingress.kubernetes.io/proxy-body-size: "8k"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "5"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "40"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "40"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - lastfirst.app
      secretName: lastfirst-app-tls
  rules:
    - host: lastfirst.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: yt-reverse-playlist
                port:
                  number: 80
