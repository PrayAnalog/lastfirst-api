apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: yt-reverse-playlist
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    # Pinned rather than inherited from the controller: httpapi.RequestTimeout
    # (45s) is sized to answer before nginx gives up waiting on the response.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - lastfirst.app
      secretName: lastfirst-app-tls
  rules:
    - host: lastfirst.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: yt-reverse-playlist
                port:
                  number: 80
