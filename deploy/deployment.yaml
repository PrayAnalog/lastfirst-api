apiVersion: apps/v1
kind: Deployment
metadata:
  name: yt-reverse-playlist
spec:
  replicas: 1
  selector:
    matchLabels:
      app: yt-reverse-playlist
  template:
    metadata:
      labels:
        app: yt-reverse-playlist
    spec:
      # preStop runs to completion before the container is sent SIGTERM, so the
      # pod keeps serving normally while its removal from the Service endpoints
      # propagates through kube-proxy and the nginx ingress. Without it the
      # server closes its listener while requests are still being routed here,
      # and those requests are refused rather than drained.
      # terminationGracePeriodSeconds covers that delay plus shutdownTimeout in
      # cmd/server/main.go (145s), with room left before the kubelet's SIGKILL.
      terminationGracePeriodSeconds: 165
      containers:
        - name: backend
          image: registry.digitalocean.com/lastfirst/backend:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: YT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: yt-api-key
                  key: YT_API_KEY
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 20
