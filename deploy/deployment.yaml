apiVersion: apps/v1
kind: Deployment
metadata:
  name: yt-reverse-playlist
spec:
  replicas: 1
  selector:
    matchLabels:
      app: yt-reverse-playlist
  template:
    metadata:
      labels:
        app: yt-reverse-playlist
    spec:
      # preStop (5s) + shutdownTimeout in cmd/server/main.go (55s), with room
      # left before the kubelet's SIGKILL.
      terminationGracePeriodSeconds: 65
      containers:
        - name: backend
          image: registry.digitalocean.com/lastfirst/backend:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: YT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: yt-api-key
                  key: YT_API_KEY
          lifecycle:
            # Keeps serving while the pod's removal from the Service endpoints
            # reaches kube-proxy and the ingress; SIGTERM, and with it the
            # closed listener, comes only after this returns.
            preStop:
              exec:
                command: ["sleep", "5"]
