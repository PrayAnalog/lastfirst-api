name: Pending deploy
on:
  push:
    branches: [main]
jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        shell: bash
        run: |
          shopt -s inherit_errexit
          prs=$(gh api --paginate "repos/$GH_REPO/compare/$BEFORE...$AFTER?per_page=100" --jq '.commits[].sha' |
            while read -r sha; do
              gh api "repos/$GH_REPO/commits/$sha/pulls" --jq '.[] | select(.merged_at != null and .base.ref == "main") | .number'
            done | sort -un)
          issues=$(for pr in $prs; do
              gh api "repos/$GH_REPO/pulls/$pr" --jq '.body // ""' | sed -nE 's/^Refs #([0-9]+).*/\1/p'
            done | sort -un)
          [ -n "$issues" ] || exit 0
          gh label create pending-deploy --color C5DEF5 --description "Merged; not deployed yet" --force
          err=$(mktemp)
          for issue in $issues; do
            if ! open=$(gh api "repos/$GH_REPO/issues/$issue" --jq 'select(.pull_request == null and .state == "open") | .number' 2>"$err"); then
              grep -qE 'HTTP (404|410)' "$err" || { cat "$err" >&2; exit 1; }
              continue
            fi
            [ -n "$open" ] || continue
            gh issue edit "$issue" --add-label pending-deploy
          done
