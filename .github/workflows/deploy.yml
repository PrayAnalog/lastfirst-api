name: Deploy
on:
  push:
    tags: ['v*']
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.ref_name }}
      IMAGE: ghcr.io/prayanalog/lastfirst:${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: backend
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: PrayAnalog/lastfirst-web
          ref: main
          token: ${{ secrets.WEB_REPO_TOKEN }}
          path: frontend
          persist-credentials: false
      - env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - run: docker build -f backend/Dockerfile -t "$IMAGE" . && docker push "$IMAGE"
      - env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key "deploy@$HOST" "$TAG"
  release:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: read
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          shopt -s inherit_errexit
          merged_prs() {
            gh api --paginate "repos/$GH_REPO/compare/$1?per_page=100" --jq '.commits[].sha' |
              while read -r sha; do
                gh api "repos/$GH_REPO/commits/$sha/pulls" --jq '.[] | select(.merged_at != null and .base.ref == "main") | .number'
              done | sort -un
          }
          refs() {
            local body
            body=$(gh api "repos/$GH_REPO/pulls/$1" --jq '.body // ""')
            sed -nE 's/^Refs #([0-9]+).*/\1/p' <<<"$body" | sort -un
          }
          prev=$({ gh release list --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName | select(. != env.TAG)'; echo "$TAG"; } |
            sort -V | awk -v tag="$TAG" '$0 == tag { print p } { p = $0 }')
          gh release view "$TAG" --json tagName >/dev/null || gh release create "$TAG" --verify-tag --generate-notes
          [ -n "$prev" ] || exit 0
          declare -A deployed undeployed
          prs=$(merged_prs "$prev...$TAG")
          for pr in $prs; do
            issues=$(refs "$pr")
            for issue in $issues; do
              deployed[$issue]+=" #$pr"
            done
          done
          prs=$(merged_prs "$TAG...main")
          for pr in $prs; do
            issues=$(refs "$pr")
            for issue in $issues; do
              undeployed[$issue]=1
            done
          done
          gh label create pending-verify --color FBCA04 --description "Deployed; close after verifying in production" --force
          gh label create pending-deploy --color C5DEF5 --description "Merged; not deployed yet" --force
          err=$(mktemp)
          for issue in "${!deployed[@]}"; do
            if ! open=$(gh api "repos/$GH_REPO/issues/$issue" --jq 'select(.pull_request == null and .state == "open") | .number' 2>"$err"); then
              grep -qE 'HTTP (404|410)' "$err" || { cat "$err" >&2; exit 1; }
              continue
            fi
            [ -n "$open" ] || continue
            body="Deployed in $TAG by${deployed[$issue]}. Close this issue once the change is verified in production."
            posted=$(BODY="$body" gh api --paginate "repos/$GH_REPO/issues/$issue/comments" --jq '.[] | select(.body == env.BODY) | .id')
            [ -n "$posted" ] || gh issue comment "$issue" --body "$body"
            if [ -n "${undeployed[$issue]-}" ]; then
              gh issue edit "$issue" --add-label pending-verify
            else
              gh issue edit "$issue" --add-label pending-verify --remove-label pending-deploy
            fi
          done
