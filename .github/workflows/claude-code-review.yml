name: Code Review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - id: author
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ACTION: ${{ github.event.action }}
          PR: ${{ github.event.pull_request.number }}
          COMMITS: ${{ github.event.pull_request.commits }}
          HEAD_REF: ${{ github.head_ref }}
          OWNER: ${{ github.repository_owner }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          trailer='test("(?im)^co-authored-by: claude [^\n]*<noreply@anthropic\\.com>$")'
          all=false
          if [ "$ACTION" = synchronize ]; then
            prior=$(gh api "repos/$REPO/actions/workflows/claude-code-review.yml/runs?head_sha=$BEFORE&event=pull_request&per_page=100" --jq '[.workflow_runs[] | select(.head_branch == env.HEAD_REF)][0] | "\(.conclusion // "") \(.created_at // "")"')
            retargeted=$(gh api --paginate "repos/$REPO/issues/$PR/events" --jq '.[] | select(.event == "base_ref_changed") | .created_at')
            retargeted=$(printf '%s\n' "$retargeted" | sort | tail -n1)
            prs=$(gh api -X GET "repos/$REPO/pulls" -f state=all -f head="$OWNER:$HEAD_REF" --jq length)
            if [ "$prs" = 1 ] && [ "${prior%% *}" = success ] && [[ "$retargeted" < "${prior#* }" ]]; then
              all=$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" --jq "if .status == \"ahead\" and .total_commits == (.commits | length) then [.commits[].commit.message | $trailer] | all else false end")
            fi
          fi
          if printf '%s\n' "$all" | grep -qx false; then
            commits=$(gh api --paginate "repos/$REPO/pulls/$PR/commits" --jq ".[] | \"\(.sha) \(.commit.message | $trailer)\"")
            all=$(printf '%s\n' "$commits" | cut -d' ' -f2)
            [ "$(printf '%s\n' "$all" | grep -c .)" = "$COMMITS" ] || all=false
            printf '%s\n' "$commits" | grep -q "^$HEAD_SHA " || all=false
          fi
          if ! printf '%s\n' "$all" | grep -qx false; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.author.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - if: steps.author.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Read,Grep,Glob,LS,Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'
