name: Code Review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - id: author
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ACTION: ${{ github.event.action }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          trailer='test("(?im)^co-authored-by: claude [^\n]*<noreply@anthropic\\.com>$")'
          if [ "$ACTION" = synchronize ]; then
            all=$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" --jq "[.commits[].commit.message | $trailer] | all")
          else
            all=$(gh api --paginate "repos/$REPO/pulls/$PR/commits" --jq "[.[].commit.message | $trailer] | all")
          fi
          if ! printf '%s\n' "$all" | grep -qx false; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.author.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - if: steps.author.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Read,Grep,Glob,LS,Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'
